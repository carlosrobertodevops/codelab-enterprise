services:
  postgres:
    image: postgres:16-alpine
    container_name: codelab_postgres
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelab}
      POSTGRES_USER: ${POSTGRES_USER:-codelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-codelab} -d ${POSTGRES_DB:-codelab} -h 127.0.0.1 -p 5432",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: codelab_redis
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: codelab_pgadmin
    env_file:
      - .env.dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Migrations SEM pooler (correto)
  db-migrate:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    image: codelab-enterprise-db-migrate:latest
    container_name: codelab_db_migrate
    env_file:
      - .env.dev
    environment:
      # força Postgres direto
      DATABASE_URL: postgresql://${POSTGRES_USER:-codelab}:${POSTGRES_PASSWORD:-codelab}@postgres:5432/${POSTGRES_DB:-codelab}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
    command:
      ["sh", "-lc", "npx prisma migrate deploy --schema=prisma/schema.prisma"]

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    image: codelab-enterprise-api:latest
    container_name: codelab_api
    env_file:
      - .env.dev
    environment:
      # ✅ Garante que a API NÃO use pgbouncer
      DATABASE_URL: postgresql://${POSTGRES_USER:-codelab}:${POSTGRES_PASSWORD:-codelab}@postgres:5432/${POSTGRES_DB:-codelab}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app_net
    expose:
      - "3001"

  api-worker:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    image: codelab-enterprise-api-worker:latest
    container_name: codelab_api_worker
    env_file:
      - .env.dev
    environment:
      # ✅ Worker também direto no Postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-codelab}:${POSTGRES_PASSWORD:-codelab}@postgres:5432/${POSTGRES_DB:-codelab}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - app_net
    # ✅ Corrige o script inexistente start:worker
    command: ["sh", "-lc", "yarn worker"]

  app:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    image: codelab-enterprise-app:latest
    container_name: codelab_app
    env_file:
      - .env.dev
    environment:
      # (Se o app precisar do DB por algum motivo, mantém direto também)
      DATABASE_URL: postgresql://${POSTGRES_USER:-codelab}:${POSTGRES_PASSWORD:-codelab}@postgres:5432/${POSTGRES_DB:-codelab}?schema=public
    depends_on:
      api:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app_net
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: codelab_nginx
    depends_on:
      - app
      - api
    ports:
      - "80:80"
    networks:
      - app_net
    # ✅ Monta DIRETÓRIO (evita erro file/dir)
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro

networks:
  app_net:

volumes:
  pg_data:
  redis_data:
  pgadmin_data:
